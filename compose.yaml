services:
  postgres:
    image: postgres:17-alpine
    container_name: clicker_postgres
    environment:
      POSTGRES_USER: clicker_admin
      POSTGRES_PASSWORD: clicker_super_password
      POSTGRES_DB: crypto_clicker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clicker_admin -d crypto_clicker"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: clicker_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
