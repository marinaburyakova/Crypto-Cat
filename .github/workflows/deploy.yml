name: Build & Deploy to Server

on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MERCHANT_WALLET_ADDRESS: ${{ secrets.MERCHANT_WALLET_ADDRESS }}
          TON_RPC_ENDPOINT: ${{ secrets.TON_RPC_ENDPOINT }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
          NODE_TLS_REJECT_UNAUTHORIZED: ${{ secrets.NODE_TLS_REJECT_UNAUTHORIZED }}

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MERCHANT_WALLET_ADDRESS: ${{ secrets.MERCHANT_WALLET_ADDRESS }}
          TON_RPC_ENDPOINT: ${{ secrets.TON_RPC_ENDPOINT }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
          NODE_TLS_REJECT_UNAUTHORIZED: ${{ secrets.NODE_TLS_REJECT_UNAUTHORIZED }}

      - name: Install production dependencies
        run: npm install --production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MERCHANT_WALLET_ADDRESS: ${{ secrets.MERCHANT_WALLET_ADDRESS }}
          TON_RPC_ENDPOINT: ${{ secrets.TON_RPC_ENDPOINT }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
          NODE_TLS_REJECT_UNAUTHORIZED: ${{ secrets.NODE_TLS_REJECT_UNAUTHORIZED }}

      - name: Prepare deployment package
        run: |
          tar -czf deploy.tar.gz .next node_modules package.json package-lock.json public prisma 2>/dev/null || tar -czf deploy.tar.gz .next node_modules package.json package-lock.json

      - name: Deploy archive to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: 'deploy.tar.gz'
          target: '/root/Crypto-Cat'

      - name: Extract package and Restart PM2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/Crypto-Cat
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz


            pm2 delete crypto-cat 2>/dev/null || true
            pm2 start npm --name "crypto-cat" -- start -- -H 0.0.0.0 -p 3000
            pm2 save
