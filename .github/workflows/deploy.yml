name: Deploy via Docker Compose

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/Crypto-Cat || mkdir -p /root/Crypto-Cat && cd /root/Crypto-Cat

            if [ ! -f docker-compose.yml ]; then
              echo "docker-compose.yml not found, copying from repo..."
              curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/main/compose.yaml -o docker-compose.yml
            fi

            echo "DATABASE_URL=postgresql://clicker_admin:clicker_super_password@postgres:5432/crypto_clicker" > .env
            echo "REDIS_URL=redis://redis:6379" >> .env
            echo "GIGACHAT_CREDENTIALS=${{ secrets.GIGACHAT_CREDENTIALS }}" >> .env
            echo "GIGACHAT_SCOPE=${{ secrets.GIGACHAT_SCOPE }}" >> .env
            echo "NODE_TLS_REJECT_UNAUTHORIZED=${{ secrets.NODE_TLS_REJECT_UNAUTHORIZED }}" >> .env
            echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
            echo "MERCHANT_WALLET_ADDRESS=${{ secrets.MERCHANT_WALLET_ADDRESS }}" >> .env
            echo "TON_RPC_ENDPOINT=${{ secrets.TON_RPC_ENDPOINT }}" >> .env

            docker compose pull app
            docker compose up -d app
            docker compose logs --tail=30 app