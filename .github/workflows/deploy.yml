# .github/workflows/deploy.yml
name: Auto Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:latest
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          build-args: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            GIGACHAT_CREDENTIALS=${{ secrets.GIGACHAT_CREDENTIALS }}
            GIGACHAT_SCOPE=${{ secrets.GIGACHAT_SCOPE }}
            NODE_TLS_REJECT_UNAUTHORIZED=${{ secrets.NODE_TLS_REJECT_UNAUTHORIZED }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            MERCHANT_WALLET_ADDRESS=${{ secrets.MERCHANT_WALLET_ADDRESS }}
            TON_RPC_ENDPOINT=${{ secrets.TON_RPC_ENDPOINT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /root/Crypto-Cat || exit 1

            docker tag ghcr.io/${{ env.REPO_LOWER }}:latest ghcr.io/${{ env.REPO_LOWER }}:previous || true

            docker pull ghcr.io/${{ env.REPO_LOWER }}:latest

            docker-compose down app || true

            docker-compose up -d app

            sleep 20

            if docker ps | grep -q app; then
              echo "Application started successfully"
            else
              echo "Application failed to start. Rolling back..."
              docker tag ghcr.io/${{ env.REPO_LOWER }}:previous ghcr.io/${{ env.REPO_LOWER }}:latest
              docker-compose up -d app
              exit 1
            fi

            docker-compose exec -T app npx prisma migrate deploy || true

            docker system prune -f --filter "until=24h" || true

            echo "Deployment completed successfully"
